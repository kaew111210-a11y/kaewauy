<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>การงานแต่ละวัน</title><style>
:root{--ink:#17202d;--muted:#78818f;--line:#e6eaf0;--blue:#3867f4;--soft:#eef2ff;--green:#23ab70;--bg:#f8faff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.brand{display:flex;align-items:center;gap:11px}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;font-size:22px}.brand h1{font-size:21px;margin:0}.brand small{display:block;color:var(--muted);font-size:11px}.btn{border-radius:10px;padding:11px 17px;font-weight:600}.primary{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.panel h2{margin:0 0 16px;font-size:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#f7f9fc;border-radius:12px;padding:14px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:25px;display:block;margin-top:4px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{padding:7px 13px;border-radius:8px;background:#f5f7fa;color:var(--muted);font-size:12px}.tab.on{background:var(--ink);color:#fff}.task{border:1px solid var(--line);border-radius:12px;padding:14px;margin:9px 0}.task-top{display:flex;justify-content:space-between;gap:12px}.task-title{font-weight:600;font-size:14px}.task-desc{font-size:11px;color:var(--muted);margin-top:4px}.tag{font-size:10px;padding:3px 7px;border-radius:5px;background:#f1edff;color:#674bb2}.tag.daily{background:#fff1e8;color:#d4772d}.meta{display:flex;gap:8px;align-items:center;margin-top:9px;color:var(--muted);font-size:11px}.progress{height:7px;background:#edf0f4;border-radius:10px;margin-top:10px;overflow:hidden}.bar{height:100%;background:var(--green);border-radius:10px}.actions{display:flex;align-items:center;gap:8px;margin-top:11px}.actions input{width:70px;border:1px solid var(--line);border-radius:7px;padding:6px}.actions button{background:var(--soft);color:var(--blue);padding:6px 9px;border-radius:7px;font-size:11px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:600}.form input,.form textarea,.form select{width:100%;margin-top:5px;border:1px solid var(--line);border-radius:9px;padding:10px;outline:0}.form textarea{min-height:75px;resize:vertical}.history{border-top:1px solid var(--line);margin-top:24px;padding-top:17px}.history-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f2f5;font-size:12px}.history-row small{display:block;color:var(--muted);margin-top:3px}.empty{text-align:center;color:var(--muted);padding:30px}.user{display:flex;justify-content:space-between;align-items:center;margin:11px 0}.user input{width:65px;padding:6px;border:1px solid var(--line);border-radius:7px}.notice{display:none;margin:10px 0;padding:10px;border-radius:9px;background:#fff2e8;color:#a85a20;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.header{align-items:flex-start;gap:12px}}@media(max-width:500px){.header{display:block}.header .btn{margin-top:15px}.stats{gap:6px}.stat{padding:10px}}
</style></head><body><div class="wrap"><header class="header"><div class="brand"><div class="logo">✓</div><div><h1>การงานแต่ละวัน</h1><small>จัดการงานร่วมกันของแก้วและอุ้ย</small></div></div><button class="btn primary" id="newBtn">＋ สร้างงานใหม่</button></header><div id="notice" class="notice"></div><div class="stats"><div class="stat"><small>งานทั้งหมด</small><strong id="allCount">0</strong></div><div class="stat"><small>กำลังทำ</small><strong id="openCount">0</strong></div><div class="stat"><small>เสร็จแล้ว</small><strong id="doneCount">0</strong></div></div><div class="grid"><section class="panel"><h2>งานของเรา</h2><div class="tabs"><button class="tab on" data-filter="all">ทั้งหมด</button><button class="tab" data-filter="open">ค้างอยู่</button><button class="tab" data-filter="done">เสร็จแล้ว</button></div><div id="tasks"></div><div class="history"><h2>ประวัติการทำงาน</h2><div id="history"></div></div></section><aside><section class="panel"><h2>สร้างงานใหม่</h2><form class="form" id="taskForm"><label>ชื่องาน<input id="title" required placeholder="เช่น เตรียมเอกสารประชุม"></label><label>รายละเอียด<textarea id="description" placeholder="รายละเอียดของงาน"></textarea></label><label>ประเภทงาน<select id="type"><option value="once">งานค้างจนกว่าจะทำเสร็จ</option><option value="daily">งานที่ต้องทำทุกวัน</option></select></label><label>เป็นงานของบัญชี<select id="owner"><option>แก้ว</option><option>อุ้ย</option></select></label><button class="btn primary" type="submit">สร้างงาน</button></form></section><section class="panel" style="margin-top:18px"><h2>ความคืบหน้าของแต่ละบัญชี</h2><div id="accounts"></div></section></aside></div></div><script>
const API='api.php';let state={tasks:[],accounts:[],history:[]},filter='all';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function show(msg){const n=$('#notice');n.textContent=msg;n.style.display='block';setTimeout(()=>n.style.display='none',3500)}async function api(payload){const r=await fetch(API,{method:payload?'POST':'GET',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});const x=await r.json();if(!x.ok)throw Error(x.error||'เกิดข้อผิดพลาด');return x}function render(){const ts=state.tasks.filter(t=>filter==='all'||filter==='open'&&!t.done||filter==='done'&&t.done);$('#allCount').textContent=state.tasks.length;$('#openCount').textContent=state.tasks.filter(t=>!t.done).length;$('#doneCount').textContent=state.tasks.filter(t=>t.done).length;$('#tasks').innerHTML=ts.length?ts.map(t=>`<article class="task"><div class="task-top"><div><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(t.description)||'ไม่มีรายละเอียด'}</div></div><span class="tag ${t.type}">${t.type==='daily'?'↻ ทุกวัน':'◷ งานค้าง'}</span></div><div class="meta">บัญชี: ${esc(t.owner)} · ${t.done?'เสร็จแล้ว':'กำลังทำ'}</div><div class="progress"><div class="bar" style="width:${t.progress}%"></div></div><div class="actions"><input type="number" min="0" max="100" value="${t.progress}" id="p${t.id}"><span style="font-size:11px;color:#78818f">%</span><button onclick="updateTask(${t.id})">บันทึกความคืบหน้า</button><button onclick="deleteTask(${t.id})">ลบ</button></div></article>`).join(''):'<div class="empty">ยังไม่มีงานในรายการนี้</div>';$('#accounts').innerHTML=state.accounts.map(a=>`<div class="user"><span>${esc(a.name)}</span><div><input type="number" min="0" max="100" value="${a.progress}" id="a${a.id}"> % <button class="actions" onclick="updateAccount('${esc(a.name)}',${a.id})">บันทึก</button></div></div>`).join('');$('#history').innerHTML=state.history.length?state.history.slice(0,10).map(h=>`<div class="history-row"><div><b>${esc(h.title)}</b><small>${esc(h.owner)} · ${esc(h.action)} · ${h.progress}%</small></div><small>${new Date(h.created_at).toLocaleString('th-TH')}</small></div>`).join(''):'<div class="empty">ยังไม่มีประวัติ</div>'}async function load(){try{state=await api();render()}catch(e){show('เชื่อมฐานข้อมูลไม่ได้: เปิด Apache/MySQL และ Import database.sql ก่อน')}}window.updateTask=async id=>{try{await api({action:'update',id,progress:Number($('#p'+id).value)});await load()}catch(e){show(e.message)}};window.deleteTask=async id=>{if(!confirm('ลบงานนี้หรือไม่'))return;try{await api({action:'delete',id});await load()}catch(e){show(e.message)}};window.updateAccount=async(name,id)=>{try{await api({action:'account_progress',owner:name,progress:Number($('#a'+id).value)});await load()}catch(e){show(e.message)}};$('#taskForm').onsubmit=async e=>{e.preventDefault();try{await api({action:'create',title:$('#title').value,description:$('#description').value,type:$('#type').value,owner:$('#owner').value});e.target.reset();await load()}catch(x){show(x.message)}};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.filter;render()});$('#newBtn').onclick=()=>$('#title').focus();load();
</script><div id="loginScreen" style="position:fixed;inset:0;background:#f8faff;display:grid;place-items:center;z-index:20;padding:20px"><form id="loginForm" style="width:min(380px,100%);background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:28px;box-shadow:0 18px 50px #17202d18"><div style="text-align:center;margin-bottom:22px"><div class="logo" style="margin:auto">✓</div><h2 style="margin:12px 0 4px">เข้าสู่ระบบ</h2><small style="color:#78818f">การงานแต่ละวัน</small></div><label style="font-size:12px;font-weight:600">รหัสผู้ใช้<select id="loginUser" style="display:block;width:100%;margin-top:6px;border:1px solid #e6eaf0;border-radius:9px;padding:10px"><option value="kaew">kaew (แก้ว)</option><option value="auy">auy (อุ้ย)</option></select></label><label style="display:block;font-size:12px;font-weight:600;margin-top:13px">รหัสผ่าน<input id="loginPassword" type="password" required placeholder="กรอกรหัสผ่าน" style="display:block;width:100%;margin-top:6px;border:1px solid #e6eaf0;border-radius:9px;padding:10px"></label><button class="btn primary" style="width:100%;margin-top:18px" type="submit">เข้าสู่ระบบ</button><p id="loginError" style="color:#c55353;font-size:12px;text-align:center"></p><small style="display:block;color:#78818f;text-align:center">รหัสเริ่มต้น: kaew / kaew หรือ auy / auy</small></form></div><script>
const loginScreen=document.getElementById('loginScreen');document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('loginError');err.textContent='กำลังเข้าสู่ระบบ...';try{const r=await fetch('api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:document.getElementById('loginUser').value,password:document.getElementById('loginPassword').value})});const x=await r.json();if(!x.ok)throw Error(x.error);location.reload()}catch(x){err.textContent=x.message||'เข้าสู่ระบบไม่สำเร็จ'}};
</script><script>fetch('api.php').then(r=>r.json()).then(x=>{if(x.ok)loginScreen.style.display='none'}).catch(()=>{});</script></body></html>
<style>#loginScreen{display:none!important}</style>
<script>(function(){const originalFetch=window.fetch;window.fetch=async function(){const response=await originalFetch.apply(this,arguments);const url=String(arguments[0]||'');if(!url.includes('api.php'))return response;const text=await response.text();let body=text;try{JSON.parse(text)}catch(e){body=JSON.stringify({ok:false,error:text?'api.php ส่งข้อความที่ไม่ใช่ JSON กรุณาตรวจสอบ PHP error':'api.php ส่งข้อมูลว่างกลับมา กรุณาเปิดผ่าน http://localhost และตรวจสอบ Apache/MySQL'})}return new Response(body,{status:response.status,statusText:response.statusText,headers:{'Content-Type':'application/json'}})}})();</script>
